<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#f6f1ff" />
<meta name="description" content="Floatling — a soft balloon-slingshot prototype." />
<title>Floatling</title>
<link rel="stylesheet" href="style.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='13' r='9' fill='%23ff9fb4'/><rect x='15' y='21' width='2' height='7' rx='1' fill='%23c9b8e4'/></svg>" />
</head>
<body>
  <div id="stage">
    <canvas id="game" width="540" height="960" aria-label="Floatling game"></canvas>

    <div id="hud">
      <div id="levelLabel">Level 1 / 5</div>
      <button id="restartBtn" type="button" aria-label="Restart level">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5V2.5L7.8 6.2 12 9.9V7a5 5 0 1 1-5 5" />
        </svg>
      </button>
    </div>

    <div id="hint" class="hidden"></div>

    <div id="endCard" class="hidden">
      <div class="end-inner">
        <div class="end-balloon" aria-hidden="true">
          <svg viewBox="0 0 120 162">
            <ellipse cx="60" cy="58" rx="42" ry="48" fill="#ff9fb4"/>
            <ellipse cx="46" cy="42" rx="13" ry="18" fill="#ffd3dd" opacity=".75"/>
            <path d="M54 104 h12 l-6 10 z" fill="#f5849c"/>
            <path d="M60 114 q6 11 0 16" stroke="#cbbce6" stroke-width="3" fill="none" stroke-linecap="round"/>
            <g stroke="#ecdbd1" stroke-width="1.2">
              <ellipse cx="54.5" cy="131" rx="3.6" ry="9" fill="#fff6ee"/>
              <ellipse cx="65.5" cy="131" rx="3.6" ry="9" fill="#fff6ee"/>
              <circle cx="60" cy="143" r="13" fill="#fff6ee"/>
            </g>
            <ellipse cx="54.5" cy="131.5" rx="1.7" ry="5.6" fill="#ffd3dd"/>
            <ellipse cx="65.5" cy="131.5" rx="1.7" ry="5.6" fill="#ffd3dd"/>
            <ellipse cx="52.6" cy="146" rx="3" ry="2.1" fill="#ffc4d1"/>
            <ellipse cx="67.4" cy="146" rx="3" ry="2.1" fill="#ffc4d1"/>
            <circle cx="55.6" cy="141.6" r="1.9" fill="#4a3f55"/>
            <circle cx="64.4" cy="141.6" r="1.9" fill="#4a3f55"/>
            <ellipse cx="60" cy="145.6" rx="1.5" ry="1.2" fill="#f08fa6"/>
            <path d="M57.8 149 q2.2 2 4.4 0" stroke="#f08fa6" stroke-width="1.2" fill="none" stroke-linecap="round"/>
          </svg>
        </div>
        <h1>Floatling</h1>
        <p>Prototype Complete</p>
        <button id="endRestart" type="button">Restart</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
