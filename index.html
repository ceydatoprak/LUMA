<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05060f" />
<meta name="color-scheme" content="dark" />
<meta name="description" content="FLUX — a neon physics puzzle prototype. Drag, aim, release." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>FLUX</title>
<link rel="stylesheet" href="style.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><radialGradient id='g'><stop offset='0' stop-color='%23ffffff'/><stop offset='.45' stop-color='%23b07cff'/><stop offset='1' stop-color='%234a1d9e'/></radialGradient></defs><rect width='32' height='32' rx='8' fill='%23090c1c'/><circle cx='16' cy='16' r='9' fill='url(%23g)'/><circle cx='16' cy='16' r='12' fill='none' stroke='%232ee6ff' stroke-opacity='.55' stroke-width='1.2'/></svg>" />
</head>
<body>
  <div id="app">
    <div class="ambient" aria-hidden="true">
      <span class="blob b1"></span>
      <span class="blob b2"></span>
      <span class="blob b3"></span>
    </div>

    <div class="deskmark" aria-hidden="true">
      <span class="dm-name">FLUX</span>
      <span class="dm-sub">Physics puzzle · vertical slice</span>
      <span class="dm-keys">Drag from the orb to launch · R restart · M mute</span>
    </div>

    <div id="stage">
      <canvas id="game" width="540" height="960" aria-label="FLUX playfield"></canvas>

      <div id="ui">
        <header id="hud">
          <div class="hud-main">
            <div class="hud-row">
              <span class="hud-key">LEVEL</span>
              <span id="levelNum">01</span>
              <span class="hud-sep">/</span>
              <span class="hud-tot">08</span>
              <span id="levelName">INFLUX</span>
            </div>
            <div id="progress"><i id="progressFill"></i></div>
          </div>
          <div class="hud-side">
            <div id="shots" title="Launches used">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20 L20 4 M20 4 h-6 M20 4 v6"/></svg>
              <span id="shotCount">0</span>
            </div>
            <button id="restartBtn" type="button" aria-label="Restart level">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 5.2V2.2L7.4 6.1 12 10V7.2a4.9 4.9 0 1 1-4.9 4.9" />
              </svg>
            </button>
          </div>
        </header>

        <div id="banner" aria-hidden="true">
          <div class="banner-num">01</div>
          <div class="banner-line"></div>
          <div class="banner-name">INFLUX</div>
        </div>

        <div id="hint" class="hidden"></div>

        <div id="toast" class="hidden"></div>
      </div>

      <div id="endCard" class="hidden">
        <div class="end-glow" aria-hidden="true"></div>
        <div class="end-inner">
          <div class="end-orb" aria-hidden="true">
            <span class="ring r1"></span>
            <span class="ring r2"></span>
            <span class="core"></span>
            <span class="spark s1"></span>
            <span class="spark s2"></span>
            <span class="spark s3"></span>
          </div>
          <h1>FLUX</h1>
          <p class="end-sub">Prototype Complete</p>
          <div class="end-stats">
            <div><span id="endShots">0</span><em>launches</em></div>
            <div><span id="endTime">0:00</span><em>runtime</em></div>
          </div>
          <button id="endRestart" type="button">Replay</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
