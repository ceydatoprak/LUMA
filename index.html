<!DOCTYPE html>
<!-- Every name and every player-facing string on this page is filled in by
     game.js from the GAME and TEXT tables. Nothing here hardcodes the title,
     the language or a label, so renaming the game is a one-line change. -->
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05060f" />
<meta name="color-scheme" content="dark" />
<meta name="description" content="" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title></title>
<link rel="stylesheet" href="style.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><radialGradient id='g'><stop offset='0' stop-color='%23ffffff'/><stop offset='.45' stop-color='%23b07cff'/><stop offset='1' stop-color='%234a1d9e'/></radialGradient></defs><rect width='32' height='32' rx='8' fill='%23090c1c'/><circle cx='16' cy='16' r='9' fill='url(%23g)'/><circle cx='16' cy='16' r='12' fill='none' stroke='%232ee6ff' stroke-opacity='.55' stroke-width='1.2'/></svg>" />
</head>
<body>
  <div id="app">
    <div class="deskmark" aria-hidden="true">
      <span class="dm-name" id="markName"></span>
      <span class="dm-sub" id="markSub"></span>
      <span class="dm-keys" id="markKeys"></span>
    </div>

    <div id="stage">
      <canvas id="game" width="540" height="960"></canvas>

      <div id="ui">
        <header id="hud">
          <div class="hud-main">
            <div class="hud-row">
              <span class="hud-key" id="hudLevelKey"></span>
              <span id="levelNum">01</span>
              <span class="hud-sep">/</span>
              <span class="hud-tot" id="levelTot"></span>
              <span id="levelName"></span>
            </div>
            <div id="progress"><i id="progressFill"></i></div>
          </div>
          <div class="hud-side">
            <button id="levelsBtn" class="hud-btn" type="button" aria-label="Bölümler">☷</button>
            <button id="soundBtn" class="hud-btn" type="button" aria-pressed="true">
              <svg class="ic-on" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 9.5h3.2L12 5.4v13.2L7.2 14.5H4z"/>
                <path d="M15.6 9.2a4 4 0 0 1 0 5.6M18.2 6.6a7.6 7.6 0 0 1 0 10.8"/>
              </svg>
              <svg class="ic-off" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 9.5h3.2L12 5.4v13.2L7.2 14.5H4z"/>
                <path d="M16.2 9.8l5 4.4M21.2 9.8l-5 4.4"/>
              </svg>
            </button>
            <button id="restartBtn" class="hud-btn" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 5.2V2.2L7.4 6.1 12 10V7.2a4.9 4.9 0 1 1-4.9 4.9" />
              </svg>
            </button>
          </div>
        </header>

        <div id="banner" aria-hidden="true">
          <div class="banner-num">01</div>
          <div class="banner-line"></div>
          <div class="banner-name"></div>
        </div>

        <div id="hint" class="hidden"></div>

        <div id="toast" class="hidden"></div>

        <div id="fps" class="hidden"></div>
      </div>

      <section id="menuCard" class="hidden" aria-label="Ana menü">
        <div class="menu-inner">
          <div class="menu-symbol" aria-hidden="true">✧</div>
          <h1 id="menuTitle"></h1>
          <p id="menuTagline"></p>
          <button id="menuStart" type="button">BAŞLA</button>
          <button id="menuLevels" type="button">BÖLÜMLER</button>
          <div id="levelGrid" class="hidden" aria-label="Bölüm seç"></div>
          <button id="menuBack" class="hidden" type="button">GERİ DÖN</button>
        </div>
      </section>
      <div id="endCard" class="hidden">
        <div class="end-glow" aria-hidden="true"></div>
        <div class="end-inner">
          <div class="end-orb" aria-hidden="true">
            <span class="ring r1"></span>
            <span class="ring r2"></span>
            <span class="core"></span>
            <span class="spark s1"></span>
            <span class="spark s2"></span>
            <span class="spark s3"></span>
          </div>
          <h1 id="endTitle"></h1>
          <p class="end-sub" id="endSub"></p>
          <div class="end-stats">
            <div hidden><span id="endTime">0:00</span><em id="endTimeLabel"></em></div>
            <div><span id="endLevels">0</span><em id="endLevelLabel"></em></div>
          </div>
          <button id="endRestart" type="button"></button>
          <button id="endSelect" type="button">BÖLÜMLER</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
